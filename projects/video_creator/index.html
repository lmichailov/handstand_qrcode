<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handstand Schnupperkurs Dortmund</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; background: #0f172a; color: #fff; padding: 20px; box-sizing: border-box;
    }
    .card {
      background: #1e293b; padding: 32px 24px; border-radius: 20px;
      text-align: center; max-width: 360px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    h1 { font-size: 22px; margin: 0 0 8px 0; }
    p { color: #94a3b8; font-size: 14px; margin: 0 0 24px 0; line-height: 1.4; }
    .btn {
      display: block; text-decoration: none; padding: 14px; border-radius: 12px;
      font-weight: 600; font-size: 16px; margin-bottom: 12px; transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-booking { background: #38bdf8; color: #0f172a; }
    .btn-insta { background: #e1306c; color: white; margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Handstand Schnupperkurs 🤸‍♂️</h1>
    <p>4. Oktober | Yoga Vidya Dortmund<br>Wähle eine Option:</p>

    <!-- Button 1: Buchung -->
    <a href="https://instagram.com/lilia.milo/" 
       data-goatcounter-click="klick-buchung" 
       class="btn btn-booking">🎟️ Platz sichern (10 €)</a>

    <!-- Button 2: Instagram -->
    <a href="https://instagram.com/lilia.milo/" 
       data-goatcounter-click="klick-instagram" 
       class="btn btn-insta">📸 Instagram Profil</a>
  </div>

  <!-- Dein GoatCounter Tracking-Skript -->
  <script data-goatcounter="https://handstand-dortmund.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
