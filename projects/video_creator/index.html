@'
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handstand Schnupperkurs & Coaching</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f7f9fa;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    h1 { font-size: 22px; margin-bottom: 10px; color: #1a1a1a; }
    p { font-size: 15px; color: #555; margin-bottom: 25px; line-height: 1.5; }
    .btn {
      display: block;
      padding: 14px 20px;
      margin-bottom: 15px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: transform 0.1s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-booking {
      background: #234d31;
      color: white;
    }
    .btn-insta {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: white;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Handstand Schnupperkurs</h1>
    <p>Sonntag, 4. Oktober • Yoga Vidya Dortmund<br>Sichere dir deinen Platz oder folge mir auf Instagram!</p>
    
    <a href="https://www.yoga-vidya.de/dortmund/" class="btn btn-booking" target="_blank">🎟️ Jetzt Kurs buchen (10 €)</a>
    <a href="https://instagram.com/lilia.milo" class="btn btn-insta" target="_blank">📸 @lilia.milo auf Instagram</a>
  </div>
</body>
</html>
'@ | Set-Content -Encoding UTF8 index.html
