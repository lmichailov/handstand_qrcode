<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handstand Schnupperkurs & Coaching</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f7f9fa;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    h1 { font-size: 22px; margin-bottom: 10px; color: #1a1a1a; }
    p { font-size: 15px; color: #555; margin-bottom: 25px; line-height: 1.5; }
    .btn {
      display: block;
      padding: 14px 20px;
      margin-bottom: 15px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: transform 0.1s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-booking {
      background: #234d31;
      color: white;
    }
    .btn-insta {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: white;
    }
  </style>

  <!-- GoatCounter Skript (no_onload verhindert doppelten automatischen Aufruf) -->
  <script data-goatcounter="https://handstand-dortmund.goatcounter.com/count"
          data-goatcounter-settings='{"no_onload": true}'
          async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <div class="card">
    <h1>Handstand Schnupperkurs</h1>
    <p>Sonntag, 4. Oktober • Yoga Vidya Dortmund<br>Sichere dir deinen Platz oder folge mir auf Instagram!</p>
    
    <a href="https://backoffice.bsport.io/one-click-booking/3795/43171505?" 
       id="btn-booking"
       class="btn btn-booking" 
       target="_blank" 
       rel="noopener noreferrer">🎟️ Jetzt Kurs buchen (10 €)</a>

    <a href="https://instagram.com/lilia.milo" 
       id="btn-insta"
       class="btn btn-insta" 
       target="_blank">📸 @lilia.milo auf Instagram</a>
  </div>

  <script>
    window.addEventListener('load', function() {
      // 1. Eintrag: QR-Code / Seitenaufruf
      if (window.goatcounter && window.goatcounter.count) {
        window.goatcounter.count({
          path: '/handstand_qrcode',
          title: 'QR-Code Aufruf',
          event: false
        });
      }

      // 2. Eintrag: Klick auf "Kurs buchen" (nur 1x pro Person)
      document.getElementById('btn-booking').addEventListener('click', function() {
        if (!localStorage.getItem('counted_booking')) {
          localStorage.setItem('counted_booking', 'true');
          if (window.goatcounter && window.goatcounter.count) {
            window.goatcounter.count({
              path: '/klick-kurs-buchen',
              title: 'Klick: Kurs buchen',
              event: false
            });
          }
        }
      });

      // 3. Eintrag: Klick auf "Instagram" (nur 1x pro Person)
      document.getElementById('btn-insta').addEventListener('click', function() {
        if (!localStorage.getItem('counted_insta')) {
          localStorage.setItem('counted_insta', 'true');
          if (window.goatcounter && window.goatcounter.count) {
            window.goatcounter.count({
              path: '/klick-instagram',
              title: 'Klick: Instagram Profil',
              event: false
            });
          }
        }
      });
    });
  </script>
</body>
</html>
